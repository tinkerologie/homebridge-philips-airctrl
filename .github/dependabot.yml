# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are held back by typescript-eslint's peer range (TypeScript < 6.1),
      # so an automatic major produces a PR that cannot pass CI.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Homebridge v2 is the supported runtime; a v3 bump is a deliberate porting decision.
      - dependency-name: homebridge
        update-types: [version-update:semver-major]
      # @types/node should describe the oldest supported Node (engines: ^22.12.0); a newer
      # major lets tsc accept APIs that do not exist on Node 22.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
