name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

jobs:
  # Everything that runs project or dependency code (install scripts, lint, build, tests)
  # happens here with a read-only token and no OIDC identity. The Publish job only uploads
  # the tarball built here.
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs full history so existing tags are visible
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Read the version and decide whether there is anything to do
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Two independent guards, so re-running this workflow — or pushing an
          # unrelated package.json edit — is a no-op rather than a failure. They are
          # tracked separately so a version that was tagged but never reached npm is
          # still published.
          TAGGED=false
          git rev-parse "v$VERSION" >/dev/null 2>&1 && TAGGED=true
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
          case "$STATUS" in
            200) PUBLISH=false ;;
            404) PUBLISH=true ;;
            *)
              echo "::error::Unexpected HTTP status $STATUS from the npm registry."
              exit 1
              ;;
          esac

          # npm provenance names this run's commit, so a tagged version must be published
          # by a run of the tagged commit itself, not built from the tag by a later run.
          if [ "$TAGGED" = true ] && [ "$PUBLISH" = true ]; then
            TAG_SHA="$(git rev-parse "v$VERSION^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::v$VERSION is tagged at $TAG_SHA but not on npm. Re-run the Release workflow run for that commit (Actions > Release, the run for $TAG_SHA > Re-run all jobs) so the package and its provenance come from the tagged commit."
              exit 1
            fi
          fi
          # A version already on npm without a tag was published by hand: leave it alone.
          RELEASE=false
          [ "$TAGGED" = false ] && [ "$PUBLISH" = true ] && RELEASE=true
          echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "::notice::v$VERSION: tagged=$TAGGED, publish=$PUBLISH, create release=$RELEASE"

      - run: npm ci
        if: steps.check.outputs.publish == 'true'

      # The full gate, re-run here rather than trusted from the CI run on this commit:
      # this is the last point before the package becomes public and immutable.
      - run: npm run lint
        if: steps.check.outputs.publish == 'true'

      - run: npm run build
        if: steps.check.outputs.publish == 'true'

      - run: npm test
        if: steps.check.outputs.publish == 'true'

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release/release-notes.md"

          # Shipping a release with an empty body is worse than not shipping it: the tag
          # is already public and the notes cannot be regenerated from anything else.
          if [ ! -s "$RUNNER_TEMP/release/release-notes.md" ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION (looked for '## [$VERSION]')."
            exit 1
          fi

      # The build above already produced dist/; --ignore-scripts keeps prepublishOnly and
      # prepack from running again while packing.
      - name: Pack the package
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"

      - name: Hand the package to the Publish job
        if: steps.check.outputs.publish == 'true' || steps.check.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7 # long enough to re-run a failed Publish job

  # The only job with write access and an OIDC identity. It does not check out the
  # repository or install anything: it publishes the tarball the Package job built.
  publish:
    name: Publish
    needs: package
    if: needs.package.outputs.publish == 'true' || needs.package.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Must match the environment configured on npm's trusted publisher.
    environment: release
    permissions:
      contents: write # create the GitHub release and tag
      id-token: write # trusted publishing (OIDC) to npm, with provenance
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.package.outputs.publish == 'true'
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+. Node 24 bundles a new enough npm, so check it
      # rather than install anything in this job.
      - name: Check npm supports trusted publishing
        if: needs.package.outputs.publish == 'true'
        run: |
          NPM_VERSION="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$NPM_VERSION"; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi

      - name: Create the GitHub release
        if: needs.package.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release/release-notes.md

      # A retried or racing run can find the version already on npm (published by an earlier
      # attempt). Skip the publish then instead of failing, so the release step still runs.
      - name: Check npm does not have this version yet
        id: npm
        if: needs.package.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          NAME="$(tar -xzOf ./release/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"
          case "$STATUS" in
            200)
              # Only skip if npm holds exactly this tarball; anything else is a conflict.
              PUBLISHED="$(curl --silent --fail "https://registry.npmjs.org/$NAME/$VERSION" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).dist?.integrity ?? ""')"
              LOCAL="sha512-$(openssl dgst -sha512 -binary ./release/*.tgz | base64 -w0)"
              if [ "$PUBLISHED" != "$LOCAL" ]; then
                echo "::error::$NAME@$VERSION is on npm with different contents ($PUBLISHED) than this run's tarball ($LOCAL)."
                exit 1
              fi
              echo "::notice::$NAME@$VERSION is already on npm with this exact tarball; skipping the publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected HTTP status $STATUS from the npm registry."
              exit 1
              ;;
          esac

      # Publishes last: a failure here leaves the tag and release in place to retry
      # against, whereas publishing first would put an unannounced package on npm.
      # --ignore-scripts: nothing from the package runs in this job.
      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: npm publish ./release/*.tgz --provenance --access public --ignore-scripts
