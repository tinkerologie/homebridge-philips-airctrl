name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needs full history so existing tags are visible

          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest

      - name: Read the version and decide whether there is anything to do
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Two independent guards, so re-running this workflow — or pushing an
          # unrelated package.json edit — is a no-op rather than a failure.
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.check.outputs.publish == 'true'

      # The full gate, re-run here rather than trusted from the CI run on this commit:
      # this is the last point before the package becomes public and immutable.
      - run: npm run lint
        if: steps.check.outputs.publish == 'true'
      - run: npm run build
        if: steps.check.outputs.publish == 'true'
      - run: npm test
        if: steps.check.outputs.publish == 'true'

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Shipping a release with an empty body is worse than not shipping it: the tag
          # is already public and the notes cannot be regenerated from anything else.
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $VERSION (looked for '## [$VERSION]')."
            exit 1
          fi

      - name: Tag the release commit
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      - name: Create the GitHub release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          body_path: release-notes.md

      # Publishes last: a failure here leaves the tag and release in place to retry
      # against, whereas publishing first would put an unannounced package on npm.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
    permissions:
      contents: write # create the GitHub release and tag
      id-token: write # trusted publishing (OIDC) to the package registry
